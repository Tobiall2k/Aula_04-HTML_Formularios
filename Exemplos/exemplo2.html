<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários - Exemplo 2</title>
</head>
<body>
    <header>
        <h1 style="text-align: center;">Cadastro de Alunos</h1>
        <hr>
        <br>
    </header>
    <main>
        <!-- Formulário de cadastro -->
         <form action="#" method="GET">
            <!-- Nome do aluno -->
            <label for="nome">Nome do aluno:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite o nome do aluno..." required>
            <br>
            <br>
            
            <!-- Campo de email -->
            <label for="email">Email do Aluno:</label>
            <input type="email" id="email" name="email" placeholder="Digite o email do aluno..." required>
            <br>
            <br>

            <!-- Campo de telefone -->
            <label for="telefone">Telefone Aluno:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="Digite o telefone do aluno..." required>
            <br>
            <br>

            <!-- Campo data de nascimento -->
            <label for="dataNascimento">Data de nascimento:</label>
            <input type="date" id="dataNascimento" name="dataNascimento" required>
            <br>
            <br>

            <!-- Idade do aluno -->
            <label for="idadeAluno">Idade do aluno:</label>
            <input type="number" id="idadeAluno" name="idadeAluno" placeholder="Digite a idade do aluno..." required>
            <br>
            <br>

            <!-- Campo de escolha -->
            <label>Você estuda para as provas?</label>
            <br>
            <br>
            <input type="radio" value="Sim" id="sim" name="pergunta" required>
            <label for="sim">Sim, estudo</label>
            <br>
            <input type="radio" value="Não" id="nao" name="pergunta" required>
            <label for="nao">Não, não estudo</label>
            <br>
            <br>

            <!-- Campo Range -->
            <label for="progresso">O quanto você gosta das aulas do SENAI</label>
            <!-- Input do tipo range cria uma barra de progresso -->
            <input type="range" id="progresso" name="progresso" required>
            <br>
            <br>

            <!-- Input de cor -->
            <label for="cor">Escolha sua cor favorita</label>
            <input type="color" id="cor" name="cor" >
            <br>
            <br>

            <!-- Campo de seleção -->
            <label for="opcao">Selecione sua sala:</label>
            <select name="opcao" id="opcao">
                <!-- Criando opções para selecionar -->
                <option value="" selected disabled>Selecione...</option>
                <option value="Sala Vermelha">Sala Vermelha</option>
                <option value="Sala Azul">Sala Azul</option>
                <option value="Sala Verde">Sala Verde</option>
            </select>
            <br>
            <br>

            <!-- Campo de arquivos -->
            <label for="file">Envie sua foto:</label>
            <input type="file" id="file" name="file">
            <br>
            <br>

            <!-- Campo com textarea -->
            <label for="observacoes">Observações</label>
            <textarea name="observacoes" id="observacoes" rows="3" cols="97">
            </textarea>
            <br>
            <br>
            
            <!-- Campo com checkbox -->
             <input type="checkbox" id="termos" name="termos" value="termos">
             <label for="termos">Li e concordo com os termos</label>
             <br>
             <input type="checkbox" id="email" name="email" value="receberEmail">
             <label for="email">Desejo receber e-mails de divulgação</label>
             <br>
             <input type="checkbox" name="receberSMS" id="receberSMS" value="receberSMS">
             <label for="receberSMS">Desejo receber SMS de divulgação</label>
             <br>
             <br>

            <!-- Botão de envio -->
            <button type="submit">Enviar</button>
         </form>
    </main>
</body>
</html>
