<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - Exemplo 1</title>
</head>
<body>
    <header>
        <h1 style="text-align: center;">Formulário de Cadastro</h1>
        <hr>
        <br>
    </header>
    <!-- Conteúdo principal -->
    <main>
        <!-- Criação de Formulário -->
        <!-- Action com # mantém o formulário na mesma página -->
        <!-- Method GET faz o envio pela URL da página -->
         <form action="#" method="POST">
            <!-- Primeiro campo -->
             <label for="nome">Nome:</label>
             <input type="range" id="nome" name="nome" placeholder="Digite seu nome..." required>
             <br>
             <br>
             <!-- Segundo Campo -->
             <label for="idade">Idade:</label>
             <input type="number" id="idade" name="idade" placeholder="Digite sua idade..." required>
             <br>
             <br>
             <!-- Botão para envio do <form> -->
             <button type="submit">Enviar</button>
         </form>
    </main>
</body>
</html>
