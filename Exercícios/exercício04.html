<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 4</title>
</head>
<body>
    <header>
        <h1>Inscrição em Curso</h1>
        <hr>
        <br>
    </header>
    <main>
        <form action="#" method="POST">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            <br>
            <br>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Digite seu email" required>
            <br>
            <br>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone" required>
            <br>
            <br>

            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" name="endereco" placeholder="Digite seu endereço" required>
            <br>
            <br>

            <label for="nascimento">Data de Nascimento</label>
            <input type="date" id="nascimento" name="nascimento" required>
            <br>
            <br>

            <label for="genero">Gênero</label>
            <br>
            <input type="radio" id="masculino" name="genero" required>
            <label for="masculino">Masculino</label>
            <br>
            <input type="radio" id="feminino" name="genero" required>
            <label for="feminino">Feminino</label>
            <br>
            <br>

            <label>Escolaridade</label>
            <select name="escola" id="escola" required>
                <option value="" selected disabled>Selecionar...</option>
                <option value="fund1">Fundamental I</option>
                <option value="fund2">Fundamental II</option>
                <option value="medio">Ensino Médio</option>
                <option value="graduacao">Graduação</option>
            </select>
            <br>
            <br>

            <label for="experiencia">Experiência anterior</label>
            <br>
            <textarea name="experiencia" id="experiencia" rows="8" cols="50" required></textarea>
            <br>
            <br>

            <label for="motivacao">Motivação para o curso</label>
            <input type="text" id="motivacao" name="motivacao" required>
            <br>
            <br>

            <label for="expectativa">Expectativa</label>
            <br>
            <textarea name="expectativa" id="expectativa" required></textarea>
            <br>
            <br>

            <label for="nivel">Nível de conhecimento</label>
            <br>
            <input type="range" name="nivel" id="nivel" required>
            <br>
            <br>

            <label for="horario">Disponibilidade de Horário</label>
            <input type="time" id="horario" name="horario" required>
            <br>
            <br>

            <label for="referencia">Referência de amigos</label>
            <input type="text" id="referencia" name="referencia" required>
             <br>
             <br>

            <label for="hobbies">Hobbies</label>
            <br>
            <input type="checkbox" id="caminhar" name="caminhar" required>
            <label for="caminhar">Caminhar</label>
            <br>
            <input type="checkbox" id="jogar" name="jogar" required>
            <label for="jogar">Jogar</label>
            <br>
            <input type="checkbox" id="ler" name="ler" required>
            <label for="ler">Ler</label>
            <br>
            <br>

            <label>Estado Civil</label>
            <select name="escola" id="escola" required>
                <option value="" selected disabled>Selecionar...</option>
                <option value="solteiro">Solterio</option>
                <option value="casado">Casado(a)</option>
            </select>
            <br>
            <br>

            <label>Idiomas que Fala</label>
            <select name="idiomas" id="idiomas">
                <option value="" selected disabled>Selecionar...</option>
                <option value="ingles">Ingês</option>
                <option value="espanhol">Espanhol</option>
                <option value="frances">Frances</option>
                <option value="italiano">Italiano</option>
            </select>
            <br>
            <br>

            <labe>Método de Pagamento</label>
            <select name="pagamento" id="pagamento">
                <option value="" selected disabled>Selecionar...</option>
                <option value="cartao_credito">Cartão de crédito</option>
                <option value="cartao_debito">Cartão de débito</option>
                <option value="dinheiro">Dinheiro</option>
                <option value="pix">Pix</option>
            </select>
            <br>
            <br>

            <input type="checkbox" id="termos" name="termos" required>
            <label for="termos">Aceitar Termos e Condições</label>
            <br>
             <input type="checkbox" id="novidades" name="novidades" required>
            <label for="novidades">Receber Novidades por E-mail</label>
            <br>
            <br>

            <label for="observacoes">Outras Observações</label>
            <br>
            <textarea name="observacoes" id="observacoes" rows="8" cols="50" required></textarea>
            <br>
            <br>

            <button type="submit">ENVIAR</button>
        </form>
    </main>
</body>
</html>
