<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 5</title>
</head>
<body>
    <header>
        <h1 style="text-align: center;">Inscrição em Evento</h1>
        <hr>
        <br>
    </header>
    <main>
        <form action="#" method="POST">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            <br>
            <br>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Digite seu email" required>
            <br>
            <br>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone" required>
            <br>
            <br>

            <label for="cargo">Cargo</label>
            <input type="text" id="cargo" name="cargo" placeholder="Digite seu cargo no evento" required>
            <br>
            <br>

            <label for="empresa">Empresa</label>
            <input type="text" id="empresa" name="empresa" placeholder="Digite o nome da empresa" required>
            <br>
            <br>

            <label for="data_evento">Data do evento</label>
            <input type="date" id="data_evento" name="data_evento" required>
            <br>
            <br>

            <label for="horario_chegada">Horário de chegada</label>
            <input type="time" id="horario_chegada" name="horario_chegada" required>
            <br>
            <br>

            <label for="comida_favorita">Alimentação preferida</label>
            <br>
            <textarea name="comida_favorita" id="comida_favorita" rows="8" cols="50" required></textarea>
            <br>
            <br>

            <label for="restricao_alimentar">Restrição alimentar</label>
            <br>
            <textarea name="restricao_alimentar" id="restricao_alimentar" rows="8" cols="50" required></textarea>
            <br>
            <br>

            <label for="nome_responsavel">Nome do responsável</label>
            <input type="text" id="nome_responsavel" name="nome_responsavel" placeholder="Digite o nome" required>
            <br>
            <br>

            <label for="email_acompanhante">Email do acompanhante</label>
            <input type="email" id="email_acompanhante" name="email_acompanhante" placeholder="Digite o email" required>
            <br>
            <br>

            <label for="telefone_responsavel">Telefone do responsável</label>
            <input type="tel" id="telefone_responsavel" name="telefone_responsavel" placeholder="Digite o telefone" required>
            <br>
            <br>

            <label for="data_nascimento">Data de nascimento</label>
            <input type="date" id="data_nascimento" name="data_nascimento" required>
            <br>
            <br>

            <label for="nome_empresa">Empresa do acompanhante</label>
            <input type="text" id="nome_empresa" name="nome_empresa" placeholder="Digite o nome da empresa" required>
            <br>
            <br>

            <label for="cargo_acompanhante">Cargo do acompanhante</label>
            <input type="text" id="cargo_acompanhante" name="cargo_acompanhante" placeholder="Digite o cargo" required>
            <br>
            <br>

            <label for="preferencia_assento">Preferência de assento</label>
            <input type="text" id="preferencia_assento" name="preferencia_assento" placeholder="Digite a preferência" required>
            <br>
            <br>

            <label for="informacoes">Outras informações</label>
            <br>
            <textarea name="informacoes" id="informacoes" rows="8" cols="50"></textarea>
            <br>
            <br>

            <label for="necessidades">Necessidades especiais</label>
            <input type="text" id="necessidades" name="necessidades" placeholder="Digite as necessidades" required>
            <br>
            <br>

            <input type="checkbox" id="politica_privacidade" name="politica_privacidade" required>
            <label for="politica_privacidade">Aceitar Política de Privacidade</label>
            <br>
            <br>

            <input type="checkbox" id="receber_atualizacao" name="receber_atualizacao" required>
            <label for="receber_atualizacao">Receber Atualizações sobre o Evento</label>
            <br>
            <br>
            
            <button type="submit">ENVIAR</button>
        </form>
    </main>
</body>
</html>
